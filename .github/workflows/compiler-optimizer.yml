name: Compiler optimizer regression
on:
  push:
    branches: [perf/automatic-dependency-trimming]
  pull_request:
    paths:
      - 'src/compiler/**'
      - 'tests/**'
      - '.github/workflows/compiler-optimizer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compiler regression tests
        run: node --test tests/*.test.mjs
      - name: Pinned Stratum integration fixture
        uses: actions/checkout@v4
        with:
          repository: SamG-Coder/stratum-city
          ref: 458860cb0470fa2c51516c37c1aaf34935b4e280
          path: .integration/stratum
          sparse-checkout: |
            kernels
            src/kernel-specs.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Reproducible compiler sources
        if: always()
        run: |
          git archive --format=tar HEAD src/compiler src/runtime src/kernels.js src/sandbox tests kernels scripts benchmarks showcases reports package.json package-lock.json | gzip > compiler-sources.tar.gz
          tar -czf stratum-fixture.tar.gz -C .integration/stratum kernels src/kernel-specs.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-regression-${{ github.sha }}
          path: |
            compiler-sources.tar.gz
            stratum-fixture.tar.gz
          retention-days: 7
