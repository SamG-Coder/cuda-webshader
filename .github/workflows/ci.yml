name: compiler-and-build
on: [push, pull_request, workflow_dispatch]
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - run: npm run check:cuda-syntax
      - run: npm run build
